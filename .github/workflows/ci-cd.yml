name: CI/CD

# BrBik house pattern: test/build on every push + PR, deploy only on push to main.
# DNSentinel deploys via Docker Compose (it ships a Dockerfile and uses the native
# better-sqlite3 module, which is cleaner to build in a container than on the VM).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: dnsentinel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # No .env needed: the app falls back to sane defaults (DB_PATH -> ./data,
      # PORT -> 3000) and the tests bind an ephemeral port. Do NOT `cp .env.example`
      # here — its DB_PATH is the container path (/app/data) and fails on the runner.
      - run: npm run lint
      - run: npm test

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      # `lint` is skipped: eslint isn't installed/configured yet (frontend/package.json
      # has the script but no eslint devDependency or config) — a separate follow-up,
      # not part of this Docker/CI pass. build + test are the real safety net here:
      # build proves it compiles, test is the legacy-vs-ported findings parity check.
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npm test

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Validation only — proves the Dockerfile builds before we ship it. Not pushed
      # to a registry; the VM rebuilds from source on deploy.
      - run: docker build -t dnsentinel:ci .

  deploy:
    name: Deploy to VM
    needs: [test, frontend, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (docker compose)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /var/www/dnsentinel
            git fetch --prune origin main
            git reset --hard origin/main
            # .env lives ON THE VM (SMTP creds, APP_URL). It is gitignored and must
            # be provisioned once by hand — never committed to the repo.
            docker compose up -d --build
            docker image prune -f

      - name: Health check
        run: |
          # Container rebuild + restart can take a while; retry before giving up.
          for i in $(seq 1 12); do
            if curl -fsS https://dns.brbik.com/api/health > /dev/null; then
              echo "healthy after $((i*5))s"
              curl -fsS -o /dev/null https://dns.brbik.com/
              exit 0
            fi
            echo "not ready yet (attempt $i/12)…"; sleep 5
          done
          echo "health check failed after 60s"; exit 1
