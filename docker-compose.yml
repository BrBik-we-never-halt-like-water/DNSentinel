# DNSentinel — production deploy.
#   1. Put your real values in .env (SMTP_*, MAIL_FROM, APP_URL=https://dns.brbik.com)
#   2. docker compose up -d --build
# The named volume persists the SQLite DB (users, history, alerts) across redeploys.
services:
  dnsentinel:
    build: .
    image: dnsentinel
    container_name: dnsentinel
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /app/data/dnsentinel.db
    ports:
      # Host port is set by DNS_HOST_PORT in .env (default 3000) so this app can share a
      # VM with others. Point your reverse proxy at that host port. Container stays on 3000.
      - "${DNS_HOST_PORT:-3000}:3000"
    volumes:
      - dnsentinel_data:/app/data # persistent SQLite storage — do NOT remove

volumes:
  dnsentinel_data:
